<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Restaurant</title>
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> -->
    <style>
        body { font-family: sans-serif; padding: 40px; background-color: #f8f9fa; }
        .warning-container { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            border-top: 5px solid #d9534f; /* Red warning accent */
        }
        h1 { color: #d9534f; font-size: 1.4rem; }
        p { color: #555; font-size: 1.1rem; }
        .restaurant-name { font-weight: bold; color: #000; }
        
        .btn-delete { 
            background-color: #d9534f; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .btn-delete:hover { background-color: #c9302c; }
        .cancel-link { 
            margin-left: 15px; 
            color: #666; 
            text-decoration: none; 
            font-size: 0.9em; 
        }
        .cancel-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="warning-container">
        <h1>Confirm Deletion</h1>
        <p>Are you sure you want to delete <span class="restaurant-name">{{ restaurant.name }}</span>?</p>
        
        <form action="{{ url_for('deleteRestaurant', restaurant_id=restaurant.id) }}" method="POST">
            <button type="submit" class="btn-delete">Yes, Delete Restaurant</button>
            <a class="cancel-link" href="{{ url_for('restaurant_detail') }}">Nevermind, take me back</a>
        </form>
    </div>

</body>
</html>
